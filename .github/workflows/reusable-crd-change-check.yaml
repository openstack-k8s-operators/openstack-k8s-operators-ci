# Reusable workflow to detect CRD changes on maintenance branches (18.0-frX).
# CRDs should be frozen after the initial branch creation. Changes limited to
# field `description` values are allowed. Any other structural change requires
# /override in the PR to let Tide proceed.
#
# Example caller workflow in an operator repo:
#
#   name: CRD change check
#   on:
#     pull_request:
#       branches:
#         - '18.0-fr[0-9]*'
#   jobs:
#     crd-change-check:
#       uses: openstack-k8s-operators/openstack-k8s-operators-ci/.github/workflows/reusable-crd-change-check.yaml@main

name: CRD change check for maintenance branches

on:
  workflow_call:
    inputs:
      crd_path:
        description: 'Path to the CRD bases directory to check for changes'
        required: false
        type: string
        default: 'config/crd/bases'

jobs:
  crd-change-check:
    name: Check for CRD changes since branch creation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0

    - name: Check for CRD changes in PR
      env:
        CRD_PATH: ${{ inputs.crd_path }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euxo pipefail

        if [ ! -d "${CRD_PATH}" ]; then
          echo "CRD path '${CRD_PATH}' does not exist — skipping check."
          exit 0
        fi

        echo "PR base: ${BASE_SHA}"
        echo "PR head: ${{ github.event.pull_request.head.sha }}"

        CRD_CHANGES=$(git diff --name-only "${BASE_SHA}"..HEAD -- "${CRD_PATH}")

        if [ -z "${CRD_CHANGES}" ]; then
          echo "No CRD changes in this PR."
          exit 0
        fi

        echo "CRD files changed:"
        echo "${CRD_CHANGES}"

        python3 -c "import yaml" 2>/dev/null \
            || pip3 install --quiet pyyaml

        export CRD_CHANGES
        python3 << 'PYEOF'
        import os, subprocess, sys, yaml, json

        base_sha = os.environ['BASE_SHA']
        crd_changes = os.environ['CRD_CHANGES'].splitlines()


        def strip_desc(obj):
            """Recursively remove 'description' keys."""
            if isinstance(obj, dict):
                return {k: strip_desc(v) for k, v in obj.items()
                        if k != 'description'}
            elif isinstance(obj, list):
                return [strip_desc(i) for i in obj]
            return obj


        def normalize(obj):
            """Strip descriptions only under openAPIV3Schema."""
            if isinstance(obj, dict):
                return {k: (strip_desc(v) if k == 'openAPIV3Schema'
                            else normalize(v))
                        for k, v in obj.items()}
            elif isinstance(obj, list):
                return [normalize(i) for i in obj]
            return obj


        failed = False
        for f in crd_changes:
            try:
                base_raw = subprocess.check_output(
                    ['git', 'show', f'{base_sha}:{f}'],
                    stderr=subprocess.PIPE
                ).decode()
            except subprocess.CalledProcessError:
                print(f'::error::New CRD file added: {f}')
                print('::error::Not allowed on maintenance branch.')
                failed = True
                continue

            try:
                head_raw = subprocess.check_output(
                    ['git', 'show', f'HEAD:{f}'],
                    stderr=subprocess.PIPE
                ).decode()
            except subprocess.CalledProcessError:
                print(f'::error::CRD file deleted: {f}')
                print('::error::Not allowed on maintenance branch.')
                failed = True
                continue

            try:
                base_doc = yaml.safe_load(base_raw)
                head_doc = yaml.safe_load(head_raw)
            except yaml.YAMLError as e:
                print(f'::error::Failed to parse {f}: {e}')
                failed = True
                continue

            base_norm = json.dumps(
                normalize(base_doc), sort_keys=True
            )
            head_norm = json.dumps(
                normalize(head_doc), sort_keys=True
            )

            if base_norm != head_norm:
                print(f'::error::Non-description CRD changes in {f}')
                failed = True
            else:
                print(f'OK: {f} — only description changes')

        if failed:
            print('')
            print('::error::CRD changes beyond field descriptions')
            print('::error::are not allowed on maintenance branches.')
            print('::error::Use /override if this change is intentional.')
            print('')
            print('Full diff:')
            for f in crd_changes:
                subprocess.run(
                    ['git', 'diff', f'{base_sha}..HEAD', '--', f]
                )
            sys.exit(1)
        else:
            print('All CRD changes are description-only. Allowing.')
            sys.exit(0)
        PYEOF
